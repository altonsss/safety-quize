<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산업안전 및 재해예방 20문항 종합 평가</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="app" class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">산업안전 종합 평가</h1>
                <p class="text-sm text-slate-500 mt-1">임직원 안전 숙지도 평가 (문제은행 140문항 중 무작위 20문항 출제)</p>
            </div>
            <div id="user-info" class="hidden text-right">
                <span id="user-display-name" class="font-semibold text-blue-600 block"></span>
                <span id="user-display-dept" class="text-xs text-slate-500"></span>
            </div>
        </header>

        <!-- Login Screen -->
        <div id="login-screen" class="bg-white rounded-2xl p-8 shadow-sm border border-slate-200 text-center max-w-md mx-auto my-12">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
            <h2 class="text-xl font-bold mb-2">응시자 정보 입력</h2>
            <p class="text-sm text-slate-500 mb-6">성명과 지사를 입력하신 후 시험을 시작하세요.</p>
            
            <form id="start-form" onsubmit="startQuiz(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">성명</label>
                    <input type="text" id="user-name" required placeholder="홍길동" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">소속 / 지사</label>
                    <input type="text" id="user-dept" required placeholder="예: 충청지역본부" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">출제 평가 유형</label>
                    <div class="w-full px-4 py-3 rounded-lg border border-slate-200 bg-slate-100 text-slate-600 text-sm font-semibold flex justify-between items-center">
                        <span>20문항 (기본 평가)</span>
                        <span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded">고정</span>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition shadow-md mt-2">
                    시험 시작하기
                </button>
            </form>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-6">
                <div class="flex justify-between items-center mb-2 text-sm font-semibold">
                    <span class="text-slate-600">진행률 <span id="current-num" class="text-blue-600">1</span> / <span id="total-num">20</span></span>
                    <span id="timer" class="text-amber-600 bg-amber-50 px-3 py-1 rounded-full text-xs font-bold">남은 시간: --:--</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 5%"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 mb-6">
                <span id="question-category" class="inline-block px-3 py-1 bg-slate-100 text-slate-600 rounded-md text-xs font-medium mb-3">카테고리</span>
                <h3 id="question-text" class="text-lg md:text-xl font-bold text-slate-900 mb-6 leading-relaxed">문제가 여기에 표시됩니다.</h3>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div class="flex justify-between items-center">
                <button id="prev-btn" onclick="prevQuestion()" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 font-medium text-sm transition">이전 문제</button>
                <button id="next-btn" onclick="nextQuestion()" class="px-6 py-2.5 rounded-lg bg-blue-600 text-white font-medium text-sm hover:bg-blue-700 transition shadow">다음 문제</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden bg-white rounded-2xl p-8 shadow-sm border border-slate-200 text-center my-6">
            <div id="result-icon" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4"></div>
            <h2 id="result-title" class="text-2xl font-bold mb-1"></h2>
            <p id="result-subtitle" class="text-slate-500 mb-6 text-sm"></p>

            <div class="bg-slate-50 rounded-xl p-6 max-w-sm mx-auto mb-8 grid grid-cols-2 gap-4">
                <div>
                    <span class="text-xs text-slate-400 block mb-1">최종 점수</span>
                    <span id="score-text" class="text-3xl font-extrabold text-blue-600">0점</span>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block mb-1">정답률</span>
                    <span id="accuracy-text" class="text-3xl font-extrabold text-slate-800">0%</span>
                </div>
            </div>

            <div id="submit-status" class="mb-6 text-xs text-slate-500 font-medium"></div>

            <div class="space-x-3">
                <button onclick="downloadResult()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-sm font-medium transition">결과서 다운로드 (TXT)</button>
                <button onclick="location.reload()" class="px-5 py-2.5 border border-slate-300 text-slate-700 hover:bg-slate-100 rounded-lg text-sm font-medium transition">다시 응시하기</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTcfN-Hw8PNlo7n81mhUbt4bRDwVhG_LQ0hVNuHSvjs70qLG9NAz6-Ch-ykK43nnDJ/exec"; 

        const categories = ["위험성평가", "아차사고 예방", "추락 방지 및 안전대", "화재 대응 및 대피", "자연재해 대비", "법률 및 산재보상", "작업장 안전수칙"];
        const masterBank = [];

        // 데이터 템플릿 항목별 확장 정의 (140개 서로 다른 고유 문항 생성)
        const templates = [
            // 카테고리 0: 위험성평가
            {
                cat: "위험성평가",
                items: [
                    ["위험성평가 단계 중 위험요인 식별 후 실시하는 핵심 절차는 무엇인가?", ["위험성 결정", "개선대책 실행", "최초보고 작성", "사후관리"], 0, "위험성평가는 위험요인 파악 → 위험성 결정 → 감소대책 수립·실행 순으로 진행됩니다."],
                    ["위험성평가의 최초평가는 사업장 개설 후 얼마 이내에 실시해야 하는가?", ["1개월 이내", "3개월 이내", "6개월 이내", "1년 이내"], 0, "최초평가는 사업장 개설 후 1개월 이내에 착수해야 합니다."],
                    ["수시 위험성평가를 실시해야 하는 사유로 올바르지 않은 것은?", ["기계·설비의 도입 및 변경", "작업 수칙의 신설 또는 변경", "사업장의 정기 승진 인사 발생", "중대재해 발생 시"], 2, "정기 인사 이동은 수시 위험성평가의 의무 실시 사유에 해당하지 않습니다."],
                    ["위험성평가 시 근로자 참여가 필수적으로 요구되는 단계는?", ["위험요인 파악 및 개선대책 수립", "사업자등록증 변경", "예산 편성 의결", "외부 기관 보고서 작성"], 0, "실제 작업을 수행하는 근로자의 현장 의견 반영과 참여는 필수적입니다."],
                    ["위험성의 빈도(가능성)와 강도(중대성)를 조합하여 위험성을 추정하는 방법은?", ["위험성 추정", "위험성 확인", "목표 설정", "결과 공고"], 0, "빈도와 강도를 곱하거나 더하여 위험의 크기를 추정합니다."],
                    ["위험성평가 결과를 기록하고 보존해야 하는 법적 최소 기간은?", ["1년", "3년", "5년", "10년"], 1, "산업안전보건법상 위험성평가 결과는 최소 3년간 보존해야 합니다."],
                    ["위험성 감소대책 수립 시 가장 우선적으로 고려해야 하는 원칙은?", ["본질적 위험 제거", "안전보호구 착용", "경고 표지 부착", "안전 교육 강화"], 0, "위험요인 자체를 제거하거나 대체하는 본질적 대책이 최우선입니다."],
                    ["정기 위험성평가는 매년 몇 회 이상 정기적으로 실시해야 하는가?", ["매년 1회 이상", "매 2년 1회", "매 3년 1회", "매 5년 1회"], 0, "정기 위험성평가는 매년 1회 이상 정기적으로 실시해야 합니다."],
                    ["위험성평가 수립 시 TBM(작업 전 안전점검회의)의 핵심 목적은?", ["당일 작업의 위험요인 공유 및 점검", "근로자 인사 평가", "임금 협상", "자재 구매 발주"], 0, "TBM은 당일 작업 내용과 위험요인을 현장에서 사전에 공유하는 활동입니다."],
                    ["위험성평가 시 '허용 가능한 위험'의 기준을 정하는 주체는?", ["사업주 (안전보건관리책임자)", "외부 감리원", "지방지자체 단체장", "고용노동부 장관"], 0, "사업주가 사업장의 특성을 고려하여 허용 가능한 위험 수준을 설정합니다."],
                    ["위험성평가 시 위험요인 파악 방법으로 적절하지 않은 것은?", ["현장 순습 및 근로자 면담", "사고 사례 연구 및 MSDS 확인", "경영진의 추측만으로 결정", "체크리스트 활용"], 2, "경영진의 추측이 아닌 현장 점검과 근로자 면담 등을 활용해야 합니다."],
                    ["위험성 감소대책 시행 후 반드시 실시해야 하는 마무리는?", ["잔여 위험성 확인 및 사후관리", "사원증 재발급", "외부 홍보 보도자료 배포", "회식 개최"], 0, "대책 실행 후 남아있는 위험성을 확인하고 지속 관리해야 합니다."],
                    ["위험성평가 실행을 위한 위험성평가반 구성원으로 적합하지 않은 사람은?", ["안전관리자 및 보건관리자", "해당 작업의 관리감독자", "해당 작업의 근로자", "외부 일반 주주"], 3, "사업장 현장을 잘 아는 관리감독자, 근로자, 안전/보건관리자로 구성해야 합니다."],
                    ["KRAS(위험성평가 지원시스템)를 활용하여 제공받을 수 있는 서비스는?", ["위험성평가 작성 지원 및 표준 서식 제공", "세금 감면 계산", "직원 특근비 정산", "특허 출원 대행"], 0, "안전보건공단 KRAS를 통해 위험성평가 작성과 서식을 지원받을 수 있습니다."],
                    ["위험성평가 인정사업 추진 시 소규모 사업장에 제공되는 혜택은?", ["산재보험료 율 할인 혜택", "법인세 완전 면제", "수출 관세 면제", "전기요금 전액 지원"], 0, "일정 요건을 갖춘 소규모 사업장은 산재보험율 감면 혜택을 받을 수 있습니다."],
                    ["작업환경측정 결과 및 건강진단 결과를 위험성평가에 활용해야 하는 이유는?", ["유해요인 파악의 객관적 근거 제공", "서류 작성 양을 늘리기 위해", "법적 정기 검사 생략을 위해", "예산 절감을 위해"], 0, "작업환경 측정 및 건강진단 결과는 유해물질이나 환경적 위험 파악에 중요합니다."],
                    ["위험성평가 시 화학물질 위험성평가(CHARM)에서 주로 활용하는 지표는?", ["노출수준과 유해성 등급", "물질의 구매 가격", "물질의 제조 국가", "물질의 용기 색상"], 0, "화학물질 위험성평가는 유해성과 노출 수준을 바탕으로 평가합니다."],
                    ["위험성평가 결과 교육 및 공유 방법으로 가장 효과적인 것은?", ["작업 착수 전 TBM 및 안전교육을 통한 전달", "사내 게시판에 작게 부착 후 방치", "CEO만 개인 소장", "비밀문서로 봉인"], 0, "현장 근로자가 쉽게 알 수 있도록 TBM이나 안전교육을 통해 공유해야 합니다."],
                    ["위험성평가 항목 중 근로자의 '근골격계 부담작업' 평가의 주 목적은?", ["반복작업 및 부적절한 자세에 의한 질환 예방", "근력 강화 훈련", "작업 속도 2배 향상", "체중 감량"], 0, "근골격계 부담작업 평가는 근골격계 질환을 예방하기 위해 실시합니다."],
                    ["위험성평가 최종 승인권자는 누구인가?", ["사업주(대표자)", "신입 사원", "외부 납품업체 기사", "노조 종원"], 0, "사업장의 총괄 책임자인 사업주가 최종 승인해야 합니다."]
                ]
            },
            // 카테고리 1: 아차사고 예방
            {
                cat: "아차사고 예방",
                items: [
                    ["하인리히 법칙 및 아차사고 관리에 관한 설명 중 가장 올바른 것은?", ["아차사고는 처벌 대상이다", "1건의 중대재해 발생 전 300건의 무상해 아차사고가 존재한다", "아차사고는 별도로 기록하지 않는다", "소형 사업장은 관리 대상에서 제외된다"], 1, "하인리히 법칙(1:29:300)에 따라 무상해 아차사고 300건을 사전 관리하는 것이 핵심입니다."],
                    ["아차사고(Near Miss)의 정의로 가장 정확한 것은?", ["인명이나 물적 피해는 없었으나 재해로 이어질 뻔한 사건", "사망자가 발생한 중대 재해", "부상자가 발생하여 병원에 입원한 사고", "기계가 완전 파손된 사고"], 0, "아차사고는 손실은 없었으나 잠재적 위험이 발현된 상태를 의미합니다."],
                    ["아차사고 발굴 및 활성화를 위해 사업장에서 취해야 할 바람직한 태도는?", ["발굴자에 대한 포상 및 무처벌 원칙", "신고자 징계 및 불이익 부여", "사고 은폐 강요", "보고서 제출 금지"], 0, "아차사고는 자발적 보고가 중요하므로 포상과 무처벌 원칙이 필요합니다."],

                masterBank.push({
                    id: idCounter++,
                    category: t.cat,
                    q: item[0],
                    options: item[1],
                    answer: item[2],
                    explanation: item[3]
                });
            });
        });

        let currentUser = { name: '', dept: '' };
        let selectedQuestions = [];
        let userAnswers = [];
        let currentIndex = 0;
        let timerInterval = null;
        let secondsLeft = 0;

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function startQuiz(e) {
            e.preventDefault();
            const name = document.getElementById('user-name').value.trim();
            const dept = document.getElementById('user-dept').value.trim();
            const count = 20;

            if (!name || !dept) return alert('성명과 지사를 입력해 주세요.');

            currentUser = { name, dept };
            document.getElementById('user-display-name').innerText = name + " 님";
            document.getElementById('user-display-dept').innerText = "지사: " + dept;
            document.getElementById('user-info').classList.remove('hidden');

            // 140개 중 중복 없이 무작위 20문항 추출
            const pool = shuffleArray(masterBank);
            selectedQuestions = pool.slice(0, count).map(q => {
                const optsWithIdx = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
                const shuffledOpts = shuffleArray(optsWithIdx);
                return {
                    category: q.category,
                    q: q.q,
                    options: shuffledOpts.map(o => o.text),
                    answer: shuffledOpts.findIndex(o => o.isCorrect),
                    explanation: q.explanation
                };
            });

            userAnswers = new Array(count).fill(null);
            currentIndex = 0;
            document.getElementById('total-num').innerText = count;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            startTimer(20 * 60);
            renderQuestion();
        }

        function startTimer(duration) {
            secondsLeft = duration;
            updateTimerDisplay();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsLeft--;
                updateTimerDisplay();
                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('시험 시간이 종료되어 자동으로 제출됩니다.');
                    finishQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(secondsLeft / 60);
            const s = secondsLeft % 60;
            document.getElementById('timer').innerText = `남은 시간: ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function selectOption(idx) {
            userAnswers[currentIndex] = idx;
            renderQuestion();
        }

        function renderQuestion() {
            const qData = selectedQuestions[currentIndex];
            document.getElementById('current-num').innerText = currentIndex + 1;
            document.getElementById('question-category').innerText = qData.category;
            document.getElementById('question-text').innerText = `${currentIndex + 1}. ${qData.q}`;

            const pct = ((currentIndex + 1) / selectedQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            qData.options.forEach((optText, i) => {
                const isSelected = userAnswers[currentIndex] === i;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full text-left p-4 rounded-xl border transition flex items-center justify-between cursor-pointer ${
                    isSelected ? 'border-blue-600 bg-blue-50 text-blue-900 font-semibold shadow-sm' : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700'
                }`;
                btn.onclick = () => selectOption(i);
                btn.innerHTML = `
                    <div class="flex items-center space-x-3 pointer-events-none">
                        <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500'}">${i + 1}</span>
                        <span class="text-sm md:text-base">${optText}</span>
                    </div>
                `;
                container.appendChild(btn);
            });

            document.getElementById('prev-btn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
            const nextBtn = document.getElementById('next-btn');
            if (currentIndex === selectedQuestions.length - 1) {
                nextBtn.innerText = '제출하기';
                nextBtn.className = 'px-6 py-2.5 rounded-lg bg-emerald-600 text-white font-medium text-sm hover:bg-emerald-700 transition shadow cursor-pointer';
            } else {
                nextBtn.innerText = '다음 문제';
                nextBtn.className = 'px-6 py-2.5 rounded-lg bg-blue-600 text-white font-medium text-sm hover:bg-blue-700 transition shadow cursor-pointer';
            }
        }

        function prevQuestion() { 
            if (currentIndex > 0) { 
                currentIndex--; 
                renderQuestion(); 
            } 
        }

        function nextQuestion() {
            if (currentIndex < selectedQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                if (userAnswers.includes(null) && !confirm('미풀이 문항이 존재합니다. 제출하시겠습니까?')) return;
                finishQuiz();
            }
        }

        function finishQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            let correct = 0;
            selectedQuestions.forEach((q, i) => { if (userAnswers[i] === q.answer) correct++; });
            const total = selectedQuestions.length;
            const score = Math.round((correct / total) * 100);

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const icon = document.getElementById('result-icon');
            if (score >= 70) {
                icon.className = 'w-20 h-20 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4';
                icon.innerHTML = '<svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                document.getElementById('result-title').innerText = '안전 숙지도 평가 합격';
                document.getElementById('result-subtitle').innerText = `${currentUser.name} 님(${currentUser.dept}), 안전 규정을 훌륭히 숙지하셨습니다.`;
            } else {
                icon.className = 'w-20 h-20 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4';
                icon.innerHTML = '<svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                document.getElementById('result-title').innerText = '재시험 대상';
                document.getElementById('result-subtitle').innerText = '안전수칙 해설집 복습 후 재응시 바랍니다.';
            }

            document.getElementById('score-text').innerText = `${score}점`;
            document.getElementById('accuracy-text').innerText = `${Math.round((correct/total)*100)}%`;

            sendDataToGoogleSheet(score, correct, total);
        }

        function sendDataToGoogleSheet(score, correct, total){
            const statusEl = document.getElementById('submit-status');
            if (!GOOGLE_SCRIPT_URL) {
                statusEl.innerText = "※ 서버 연동 URL이 설정되지 않아 데이터가 로컬에만 저장됩니다.";
                return;
            }

            statusEl.innerText = "⏳ 결과 데이터를 관리자 구글 스프레드시트로 전송 중...";

            const formData = new URLSearchParams();
            formData.append("timestamp", new Date().toLocaleString());
            formData.append("name", currentUser.name);
            formData.append("dept", currentUser.dept);
            formData.append("score", score);
            formData.append("correctCount", correct);
            formData.append("totalCount", total);

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData.toString()
            })
            .then(() => {
                statusEl.innerText = "✅ 시험 결과가 관리자 구글 스프레드시트에 성공적으로 취합되었습니다.";
                statusEl.className = "mb-6 text-xs font-medium text-emerald-600";
            })
            .catch(err => {
                console.error(err);
                statusEl.innerText = "❌ 결과 전송 중 오류가 발생했습니다.";
                statusEl.className = "mb-6 text-xs font-medium text-rose-600";
            });
        }

        function downloadResult() {
            let txt = `[산업안전 20문항 평가 결과서]\n-----------------------------------\n성명: ${currentUser.name}\n지사/소속: ${currentUser.dept}\n일시: ${new Date().toLocaleString()}\n점수: ${document.getElementById('score-text').innerText}\n-----------------------------------\n\n`;
            selectedQuestions.forEach((q, i) => {
                const uAns = userAnswers[i];
                txt += `${i + 1}. ${q.q}\n - 제출: ${uAns !== null ? q.options[uAns] : '미제출'} (${uAns === q.answer ? '정답' : '오답'})\n - 정답: ${q.options[q.answer]}\n - 해설: ${q.explanation}\n\n`;
            });
            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `안전평가결과_${currentUser.dept}_${currentUser.name}.txt`;
            link.click();
        }
    </script>
